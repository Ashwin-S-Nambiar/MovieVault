  <title id="t">MovieVault</title>
  <desc id="d">MovieVault, where to stream anything. Seven DVD cases stand on a ring, 22 degrees apart, the one in front carrying a red bookmark and the outer pair fading out, drawn with the same geometry the live reel uses.</desc>

  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="#fafaf9" stroke="rgba(17,17,16,0.10)"/>

  <g id="title-block" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="64" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="1.9" fill="#74736d">FILMS, SERIES, ANIME</text>
    <text x="64" y="170" font-size="60" font-weight="600" letter-spacing="-1.8" fill="#111110">MovieVault</text>
    <text x="64" y="216" font-size="20" fill="#111110">where to stream anything. trending titles turn</text>
    <text x="64" y="244" font-size="20" fill="#111110">on a ring of dvd cases, and the one you tap</text>
    <text x="64" y="272" font-size="20" fill="#111110">flies open into its page.</text>
    <text x="64" y="322" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#74736d">react 19<tspan fill="rgba(17,17,16,0.22)">  /  </tspan>tmdb<tspan fill="rgba(17,17,16,0.22)">  /  </tspan>justwatch<tspan fill="rgba(17,17,16,0.22)">  /  </tspan>0 animation deps</text>
  </g>

